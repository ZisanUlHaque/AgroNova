version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terrashift-postgres
    restart: always
    environment:
      POSTGRES_USER: terrashift
      POSTGRES_PASSWORD: terrashift
      POSTGRES_DB: terrashift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrashift -d terrashift"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terrashift-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: terrashift-api
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://terrashift:terrashift@postgres:5432/terrashift
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-terrashift-secret-2026}
      NASA_INGEST_WORKER_URL: http://worker:8010
      NASA_INGEST_TIMEOUT_MS: 120000
      POWER_TTL_HOURS: 24
      SMAP_TTL_DAYS: 7
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker:
    build:
      context: apps/worker
      dockerfile: Dockerfile
    container_name: terrashift-worker
    restart: always
    command: ["python", "worker.py", "--serve"]
    environment:
      NASA_WORKER_PORT: 8010
      POWER_TTL_HOURS: 24
      SMAP_TTL_DAYS: 7
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://terrashift:terrashift@postgres:5432/terrashift
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: terrashift-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      API_INTERNAL_URL: http://api:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
